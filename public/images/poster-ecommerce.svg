<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640">
  <defs>
    <linearGradient id="bg-ecom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1914"/>
      <stop offset="50%" stop-color="#06100c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="green-gold-glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="640" fill="url(#bg-ecom)"/>
  <rect width="360" height="640" fill="url(#green-gold-glow)"/>
  <!-- Minimalist Smart Device / Headphones product mockup -->
  <g opacity="0.9" transform="translate(180, 275)">
    <!-- Minimalist Over-Ear Headphones arch -->
    <path d="M-60,30 C-60,-55 60,-55 60,30" fill="none" stroke="#D4AF37" stroke-width="6" stroke-linecap="round"/>
    <!-- Headband padding -->
    <path d="M-40,-35 C-20,-48 20,-48 40,-35" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <!-- Ear cups -->
    <ellipse cx="-60" cy="35" rx="18" ry="32" fill="#0f291e" stroke="#10b981" stroke-width="2"/>
    <ellipse cx="60" cy="35" rx="18" ry="32" fill="#0f291e" stroke="#10b981" stroke-width="2"/>
    <ellipse cx="-60" cy="35" rx="10" ry="20" fill="#D4AF37" opacity="0.8"/>
    <ellipse cx="60" cy="35" rx="10" ry="20" fill="#D4AF37" opacity="0.8"/>
  </g>
  <!-- Framing guides -->
  <rect x="20" y="20" width="320" height="600" rx="16" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="1"/>
</svg>