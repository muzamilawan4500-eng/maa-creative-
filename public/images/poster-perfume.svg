<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640">
  <defs>
    <linearGradient id="bg-perfume" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e15"/>
      <stop offset="50%" stop-color="#0f070c"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="pink-gold-glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="640" fill="url(#bg-perfume)"/>
  <rect width="360" height="640" fill="url(#pink-gold-glow)"/>
  <!-- Luxury crystal perfume flacon with faceted edges -->
  <g opacity="0.9" transform="translate(180, 275)">
    <!-- Golden Cap -->
    <rect x="-24" y="-75" width="48" height="26" rx="4" fill="#D4AF37" stroke="#E8C84B" stroke-width="1.5"/>
    <rect x="-10" y="-49" width="20" height="12" fill="#B8972E"/>
    <!-- Glass Bottle Body with luxury facets -->
    <rect x="-55" y="-37" width="110" height="120" rx="10" fill="#1c1118" stroke="#D4AF37" stroke-width="2"/>
    <rect x="-42" y="-24" width="84" height="94" rx="6" fill="#2d1624" stroke="#ec4899" stroke-width="0.75" stroke-opacity="0.6"/>
    <!-- Fragrance level with amber liquid -->
    <rect x="-38" y="5" width="76" height="60" rx="4" fill="#D4AF37" fill-opacity="0.25"/>
    <!-- Minimalist bottle label plaque -->
    <rect x="-28" y="15" width="56" height="28" rx="2" fill="#0d090c" stroke="#D4AF37" stroke-width="1"/>
    <line x1="-16" y1="29" x2="16" y2="29" stroke="#D4AF37" stroke-width="1"/>
  </g>
  <!-- Framing guides -->
  <rect x="20" y="20" width="320" height="600" rx="16" fill="none" stroke="#D4AF37" stroke-opacity="0.25" stroke-width="1"/>
</svg>