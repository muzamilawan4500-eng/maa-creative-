<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640">
  <defs>
    <linearGradient id="bg-urban" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f1a"/>
      <stop offset="50%" stop-color="#0a080d"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="purple-glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#3b0764" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="640" fill="url(#bg-urban)"/>
  <rect width="360" height="640" fill="url(#purple-glow)"/>
  <!-- Streetwear hoodie silhouette / modern aesthetic framing -->
  <g opacity="0.85" transform="translate(180, 280)">
    <!-- Shoulders & Hoodie outline -->
    <path d="M-80,120 C-65,40 -45,-30 0,-45 C45,-30 65,40 80,120 Z" fill="#18141f" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Hood shape -->
    <path d="M-40,-10 C-45,-70 45,-70 40,-10 C35,20 -35,20 -40,-10 Z" fill="#120e17" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- Neon clothing tag accent -->
    <rect x="-18" y="25" width="36" height="6" rx="3" fill="#D4AF37"/>
  </g>
  <!-- Framing guides -->
  <rect x="20" y="20" width="320" height="600" rx="16" fill="none" stroke="#a855f7" stroke-opacity="0.2" stroke-width="1"/>
</svg>