<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="before-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#before-bg)"/>
  <!-- Dull flat lighting photography simulation -->
  <rect x="175" y="60" width="250" height="260" rx="12" fill="#242424" stroke="#333333" stroke-width="1"/>
  <!-- Plain boring product silhouette -->
  <g transform="translate(300, 190)" opacity="0.45">
    <rect x="-35" y="-60" width="70" height="110" rx="8" fill="#555555" stroke="#777" stroke-width="2"/>
    <rect x="-15" y="-85" width="30" height="25" rx="3" fill="#444444"/>
    <ellipse cx="0" cy="65" rx="55" ry="14" fill="#000000" opacity="0.6"/>
  </g>
  <!-- Framing marks -->
  <circle cx="300" cy="190" r="85" fill="none" stroke="#444444" stroke-dasharray="4 6" stroke-width="1"/>
  <line x1="280" y1="190" x2="320" y2="190" stroke="#444444" stroke-width="1"/>
  <line x1="300" y1="170" x2="300" y2="210" stroke="#444444" stroke-width="1"/>
</svg>