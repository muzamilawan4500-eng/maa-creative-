<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="after-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#141104"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>
    <radialGradient id="gold-radial" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#after-bg)"/>
  <rect width="600" height="400" fill="url(#gold-radial)"/>
  <!-- Cinematic 9:16 mobile ad showcase frame -->
  <g transform="translate(300, 200)">
    <!-- Smartphone / vertical video canvas -->
    <rect x="-80" y="-140" width="160" height="280" rx="18" fill="#121008" stroke="#D4AF37" stroke-width="2"/>
    <!-- Glowing video center -->
    <circle cx="0" cy="0" r="38" fill="#0A0A0A" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#D4AF37" stroke-opacity="0.25" stroke-dasharray="6 6"/>
    <!-- Gold play arrow -->
    <polygon points="-7,-12 -7,12 12,0" fill="#D4AF37"/>
    <!-- Audio wave bars -->
    <g opacity="0.75" transform="translate(-40, 95)">
      <rect x="0" y="0" width="4" height="14" rx="2" fill="#D4AF37"/>
      <rect x="10" y="-6" width="4" height="20" rx="2" fill="#D4AF37"/>
      <rect x="20" y="-12" width="4" height="26" rx="2" fill="#D4AF37"/>
      <rect x="30" y="-8" width="4" height="22" rx="2" fill="#D4AF37"/>
      <rect x="40" y="-16" width="4" height="30" rx="2" fill="#D4AF37"/>
      <rect x="50" y="-6" width="4" height="20" rx="2" fill="#D4AF37"/>
      <rect x="60" y="-2" width="4" height="16" rx="2" fill="#D4AF37"/>
      <rect x="70" y="2" width="4" height="12" rx="2" fill="#D4AF37"/>
    </g>
  </g>
</svg>