<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="50%" stop-color="#0e0e0e"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="card-spot" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="640" fill="url(#card-grad)"/>
  <rect width="360" height="640" fill="url(#card-spot)"/>
  <!-- Elegant cinematic framing guides -->
  <rect x="24" y="24" width="312" height="592" rx="16" fill="none" stroke="#D4AF37" stroke-opacity="0.12" stroke-width="1"/>
  <!-- Center lens ring -->
  <circle cx="180" cy="300" r="54" fill="#0d0d0d" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="180" cy="300" r="46" fill="none" stroke="#D4AF37" stroke-opacity="0.15" stroke-dasharray="4 6"/>
  <polygon points="175,286 175,314 195,300" fill="#D4AF37"/>
</svg>
